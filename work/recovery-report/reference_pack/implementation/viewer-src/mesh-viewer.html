<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive room model</title>
<script>self.ModelViewerElement={meshoptDecoderLocation:new URL('../../review/vendor/meshopt_decoder.js',document.baseURI).href};</script>
<script type="module" src="../../review/vendor/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#11151b;color:#edf4ff;font:14px system-ui}
model-viewer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:transparent}
#surface{position:absolute;inset:0;outline:0;touch-action:none;cursor:grab}
#surface:active{cursor:grabbing}#surface:focus-visible{outline:2px solid #4ba8cd;outline-offset:-3px}
#toolbar{position:absolute;z-index:3;top:12px;left:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
button,select,#toolbar label{pointer-events:auto}button,select{font:inherit;background:#172633ed;color:#edf4ff;border:1px solid #617d91;border-radius:7px;padding:8px 11px;cursor:pointer}
button:hover,button[aria-pressed=true]{background:#28536b}#toolbar label{display:flex;gap:7px;align-items:center;background:#172633ed;padding-left:9px;border-radius:7px}
#shading{margin-left:auto}#status{position:absolute;z-index:2;bottom:14px;left:16px;right:16px;pointer-events:none;width:fit-content;max-width:calc(100% - 50px);background:#12212ee8;color:#eef5ff;padding:9px 12px;border-radius:7px;line-height:1.5}
#loading{position:absolute;z-index:4;inset:0;display:grid;place-content:center;background:#11151bd9;text-align:center;pointer-events:none}
#loading[hidden]{display:none}.dollhouse{background:#171c22}
@media(max-width:700px){button,select{font-size:12px;padding:7px}#toolbar{gap:5px;left:8px;right:8px}#shading{margin-left:0}#status{font-size:12px}}
</style>
<model-viewer id="model" interaction-prompt="none" shadow-intensity="0" exposure="1" min-camera-orbit="auto 0deg 0.00001m" max-camera-orbit="auto 180deg auto" min-field-of-view="10deg" max-field-of-view="100deg"></model-viewer>
<div id="surface" tabindex="0" role="application" aria-label="3D room navigation. Drag to rotate, W A S D to move, Q E for height. Press R to reset."></div>
<div id="toolbar">
  <button id="home" title="Fit the model and restore the angled view (R)">Reset view</button>
  <button id="top">Top view</button><button id="rotate">Rotate 90°</button>
  <button id="orbit" aria-pressed="true" title="Rotate around the model">Orbit</button>
  <button id="walk" aria-pressed="false" title="Look around from your current position">Walk</button>
  <label>Speed <select id="speed" aria-label="Movement speed"><option value="0.35">Slow</option><option value="1" selected>Normal</option><option value="2">Fast</option></select></label>
  <button id="shading">Show surface shading</button>
</div>
<div id="status">Loading the textured model…</div>
<div id="loading"><strong>Loading the detailed model…</strong><p id="load-progress">Preparing both 8K textures</p></div>
<script type="module">
import {MeshNavigation} from './mesh-controls.js?v=2';
const $=id=>document.getElementById(id),viewer=$('model');
const params=new URLSearchParams(location.search),url=params.get('model');
let shaded=false,asset={};
function appearance(){for(const m of viewer.model?.materials||[]){const texture=m.pbrMetallicRoughness.baseColorTexture.texture;if(!texture)continue;m.emissiveTexture.setTexture(texture);m.setEmissiveFactor(shaded?[0,0,0]:[1,1,1]);m.pbrMetallicRoughness.setBaseColorFactor(shaded?[1,1,1,1]:[0,0,0,1]);}$('shading').textContent=shaded?'Show original colours':'Show surface shading';}
const nav=new MeshNavigation(viewer,$('surface'),{onMode(mode){$('walk').setAttribute('aria-pressed',String(mode==='walk'));$('orbit').setAttribute('aria-pressed',String(mode==='orbit'));$('status').textContent=mode==='walk'?'Drag to look · WASD move · Q/E down/up · Shift faster · scroll takes small steps · R resets':'Drag to rotate · right-drag to pan · WASD move · Q/E down/up · gentle scroll zoom · R resets';}});
$('home').onclick=()=>{nav.home();nav.focus();};$('top').onclick=()=>{nav.home(true);nav.focus();};$('rotate').onclick=()=>{nav.rotate();nav.focus();};
$('walk').onclick=()=>{nav.setMode('walk');nav.focus();};$('orbit').onclick=()=>{nav.setMode('orbit');nav.focus();};$('speed').onchange=()=>{nav.speed=Number($('speed').value);nav.focus();};
$('shading').onclick=()=>{shaded=!shaded;appearance();};
window.__meshAPI={loaded:false,jump:c=>nav.jump(c),home:()=>nav.home(),focus:()=>nav.focus(),keyDown:e=>nav.keyDown(e),keyUp:e=>nav.keyUp(e),release:()=>nav.release()};
viewer.addEventListener('load',()=>{appearance();let bounds=asset.bounds;if(!bounds){const center=viewer.getBoundingBoxCenter(),d=viewer.getDimensions();bounds=[[center.x-d.x/2,center.y-d.y/2,center.z-d.z/2],[center.x+d.x/2,center.y+d.y/2,center.z+d.z/2]];}nav.configure(bounds,asset.framingPoints);window.__meshAPI.loaded=true;$('loading').hidden=true;});
viewer.addEventListener('progress',e=>{$('load-progress').textContent=`${Math.round(e.detail.totalProgress*100)}% · loading geometry and textures`;});
viewer.addEventListener('error',()=>{$('loading').hidden=true;$('status').textContent='The model could not load. Reload this view or use the model download.';});
try{asset=(await fetch('models.json',{cache:'no-store'}).then(r=>r.json())).find(a=>a.url===url)||{};}catch{}
document.body.classList.toggle('dollhouse',asset.preset==='dollhouse');
await customElements.whenDefined('model-viewer');viewer.src=url;
</script>
</html>
