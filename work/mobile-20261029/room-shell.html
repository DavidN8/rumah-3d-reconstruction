<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141b23"><meta name="description" content="Explore the apartment in 3D. A fast phone view and the full original reconstruction are available.">
<title>iPhone apartment · Ruang Kamare</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#141b23;color:#edf3fa;font:14px/1.4 system-ui,sans-serif}body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}button,select,a{ -webkit-tap-highlight-color:transparent}button,select{font:inherit;color:#edf3fa;background:#243441;border:1px solid #435969;border-radius:7px;min-height:40px;padding:7px 10px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#39768a;border-color:#6bb3c4}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #8cdbeb;outline-offset:2px}a{color:#9addec}button[hidden],[hidden]{display:none!important}
header{padding:10px 16px;display:flex;align-items:center;gap:12px;background:#10161e;border-bottom:1px solid #30404e}h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap}#stats{margin-left:auto;color:#abc0d1;font-size:12px;text-align:right}nav{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:8px 12px;background:#1a2530;border-bottom:1px solid #30404e}label{display:flex;align-items:center;gap:6px;color:#abc0d1}.divider{height:23px;border-left:1px solid #435969;margin:0 3px}#quality{max-width:175px}#views{max-width:205px}#extra{display:none;align-items:center;gap:7px;flex-wrap:wrap}#extra.open{display:flex}.secondary{font-size:12px}
#stage{position:relative;display:flex;min-height:0;flex:1;overflow:hidden}#view{width:100%;height:100%;display:block;min-width:0;outline:none;touch-action:none;cursor:grab}#view:active{cursor:grabbing}#view:focus-visible{outline:2px solid #69b4c6;outline-offset:-2px}#stage.compare #view{width:50%}#source{width:50%;height:100%;background:#0e141c;position:relative;border-left:1px solid #435969;padding:26px 0 0}#source-frame{width:100%;height:100%;object-fit:contain;display:block}#source-label{position:absolute;top:5px;left:10px;font-size:12px;color:#b4c6d4}
#loading{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:18px;background:#141b23}#load-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.18}#load-card{position:relative;background:#14212df0;border:1px solid #465969;border-radius:14px;width:min(420px,100%);padding:24px;box-shadow:0 8px 40px #0008}#load-title{font-size:20px;margin:0 0 10px}#load-status{min-height:40px;color:#c5d6e4;margin:0 0 12px}progress{width:100%;height:12px;accent-color:#70ccdc}#load-detail{font-size:12px;color:#9bb2c5;min-height:18px;margin-top:8px}#load-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}#recovery{position:absolute;bottom:12px;left:12px;right:12px;z-index:4;padding:14px;background:#14212df5;border:1px solid #70ccdc;border-radius:10px}#recovery p{margin:0 0 8px}
#touch-controls{position:absolute;bottom:12px;left:12px;right:12px;z-index:2;display:none;justify-content:space-between;align-items:end;pointer-events:none}body.phone #touch-controls.walking{display:flex}.dpad{display:grid;grid-template-columns:repeat(3,44px);gap:4px}.dpad button,.height-pad button{width:44px;height:44px;padding:0;touch-action:none;background:#19303bd9;pointer-events:auto;font-size:21px;user-select:none;-webkit-user-select:none}.height-pad{display:flex;gap:6px}.dpad [data-move=forward]{grid-column:2}.dpad [data-move=left]{grid-column:1;grid-row:2}.dpad [data-move=back]{grid-column:2;grid-row:2}.dpad [data-move=right]{grid-column:3;grid-row:2}
footer{padding:7px 12px max(7px,env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid #30404e;background:#10161e;font-size:12px}#hint{color:#bed1df}#quality-note{margin-left:auto;color:#8fa5b7;font-size:11px;text-align:right}#diagnostics{display:none;position:absolute;top:5px;left:5px;z-index:2;white-space:pre-wrap;background:#08131ddd;color:#bed1df;padding:6px;font:9px monospace;max-height:112px;max-width:230px;overflow:auto;pointer-events:none}body.debug #diagnostics{display:block}
dialog{color:#edf3fa;background:#14212d;border:1px solid #435969;border-radius:14px;max-width:min(90vw,800px);max-height:92dvh;padding:18px}dialog::backdrop{background:#071018d9}#gallery header{padding:0 0 12px;background:none}#gallery h2{font-size:18px;margin:0}#gallery-close{margin-left:auto}#gallery-photo{display:block;max-height:65dvh;width:100%;object-fit:contain;margin-top:14px;background:#0c141c}#gallery-caption{color:#abc0d1;margin:8px 0 0}
@media(max-width:700px){header{padding:8px 10px;gap:6px}h1{font-size:15px}#stats{font-size:10px;max-width:150px}nav{padding:6px;gap:5px}nav button,nav select{font-size:12px;min-height:40px;padding:6px 9px}#quality{max-width:151px}#views{max-width:169px;flex:1}.divider{display:none}#stage.compare{flex-direction:column}#stage.compare #view{width:100%;height:50%}#source{width:100%;height:50%;border-left:0;border-top:1px solid #435969;padding-top:24px}footer{font-size:11px}#quality-note{display:none}#load-card{padding:19px}#extra.open{width:100%}.secondary{font-size:11px}#load-title{font-size:18px}}
@media(max-height:500px){header{padding:4px 10px}nav{padding:4px 6px}nav button,nav select{min-height:32px;padding:3px 7px}footer{padding:4px 10px;font-size:10px}#load-card{padding:12px}#load-status{min-height:0;margin-bottom:5px}#load-title{font-size:16px}#load-actions{margin-top:8px}}
</style>
</head>
<body>
<header><h1>iPhone apartment</h1><span id="stats" aria-live="polite">Opening the room…</span></header>
<nav aria-label="Room controls">
<button id="walk" data-3d aria-pressed="false" disabled>Walk</button><button id="orbit" data-3d aria-pressed="true" disabled>Orbit</button>
<button id="zoom-in" data-3d aria-label="Zoom in" disabled>＋</button><button id="zoom-out" data-3d aria-label="Zoom out" disabled>−</button>
<select id="quality" aria-label="3D quality" disabled><option value="phone">Phone · fast</option><option value="native">Full native · 435 MB</option></select>
<select id="views" data-3d aria-label="Recorded camera view" disabled><option value="">Recorded views…</option></select>
<button id="photos">Photos</button><button id="more" aria-expanded="false">More</button>
<div id="extra"><button id="top" data-3d disabled>Top view</button><button id="rotate" data-3d disabled>Rotate 90°</button><button id="reset" data-3d disabled>Reset view</button><button id="see-inside" data-3d aria-pressed="false" title="See through the backs of the ceiling and outside walls. Keeps the full height of the model." disabled>See inside</button><button id="shade" data-3d aria-pressed="false" disabled>Shading</button><button id="compare" data-3d aria-pressed="false" disabled>Compare source frame</button><label class="secondary">Speed <select id="speed" aria-label="Movement speed"><option value="0.5">Slow</option><option value="1.2" selected>Normal</option><option value="2.4">Fast</option></select></label><a id="download-native" class="secondary" href="models/iphone-full-room-16f8963b.glb" download>Download original</a></div>
</nav>
<main id="stage">
<canvas id="view" tabindex="0" aria-label="3D apartment. Drag to look. Pinch to zoom. In Walk mode use the on-screen arrows or WASD."></canvas>
<aside id="source" hidden><span id="source-label"></span><img id="source-frame" alt="Original recorded camera frame" decoding="async"></aside>
<div id="loading"><img id="load-preview" src="__OVERVIEW__" alt="" decoding="async"><section id="load-card" aria-labelledby="load-title"><h2 id="load-title">Opening the apartment</h2><p id="load-status" role="status" aria-live="polite">Choosing the right view for this screen…</p><progress id="load-progress" max="100" value="0" aria-label="Room loading progress"></progress><div id="load-detail"></div><div id="load-actions"><button id="retry" hidden>Retry phone view</button><button id="loading-photos">View photos</button><button id="cancel-load" hidden>Use phone view</button><a id="static-photo" href="sources/frame_0001612.jpg" hidden>Open a room photo</a></div></section></div>
<div id="recovery" hidden role="status"><p id="recovery-text"></p><button id="recover-phone">Reload phone view</button><button id="recovery-photos">View photos</button></div>
<div id="touch-controls" aria-label="Walking controls"><div class="dpad"><button data-move="forward" aria-label="Move forward">↑</button><button data-move="left" aria-label="Move left">←</button><button data-move="back" aria-label="Move backward">↓</button><button data-move="right" aria-label="Move right">→</button></div><div class="height-pad"><button data-move="down" aria-label="Move down">⇩</button><button data-move="up" aria-label="Move up">⇧</button></div></div>
<output id="diagnostics" aria-label="Viewer diagnostics"></output>
</main>
<footer><span id="hint">Drag to explore · Pinch to zoom</span><span id="quality-note">Approximate scale · reconstruction defects remain</span></footer>
<dialog id="gallery" aria-labelledby="gallery-title"><header><h2 id="gallery-title">Recorded photos</h2><button id="gallery-close" aria-label="Close photos">Close</button></header><select id="gallery-view" aria-label="Photo view"></select><img id="gallery-photo" alt="Original room photograph" decoding="async"><p id="gallery-caption"></p></dialog>
<noscript><p style="position:absolute;inset:30%;z-index:8;background:#14212d;padding:20px">Please enable JavaScript to explore the 3D room, or <a href="sources/frame_0001612.jpg">open a room photo</a>.</p></noscript>
<script>
(()=>{
 const byId=id=>document.getElementById(id);
 const retry=()=>{const url=new URL(location.pathname,location.origin);url.searchParams.set('quality','phone');url.searchParams.set('v','20261029');location.assign(url.href);};
 byId('retry').onclick=retry;
 const photo=()=>location.assign(byId('static-photo').href);
 byId('photos').onclick=byId('loading-photos').onclick=photo;
 const fail=()=>{
   if(document.body.dataset.phase)return;
   document.body.dataset.phase='failed';byId('load-title').textContent='The viewer could not start';
   byId('load-status').textContent='Please check the connection and retry the phone view.';
   byId('load-detail').textContent='You can still open an original room photo.';
   byId('load-progress').hidden=true;byId('retry').hidden=false;byId('static-photo').hidden=false;byId('loading-photos').hidden=true;
 };
 const timer=setTimeout(fail,20000);
 window.addEventListener('error',event=>{if(event.target?.tagName==='SCRIPT'&&event.target.src.includes('room-viewer-')){clearTimeout(timer);fail();}},true);
})();
</script>
<script src="__BUNDLE__" defer></script>
</body></html>
